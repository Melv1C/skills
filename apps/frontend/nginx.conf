server {
  listen 80;

  root /usr/share/nginx/html;
  index index.html;

  # Built JS/CSS live under /static (see vite build.assetsDir).
  # Do not use $uri/ for SPA paths — a real directory with no index
  # would otherwise return 403 instead of falling through to index.html.
  location / {
    try_files $uri /index.html;
  }
}
