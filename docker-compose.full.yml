services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    ports:
      - 5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 10
    networks:
      - app-network

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - 9000:9000
      - 9001:9001
    volumes:
      - minio_data:/data
    networks:
      - app-network

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    networks:
      - app-network
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done;
      mc mb --ignore-existing local/assets;
      mc anonymous set none local/assets;
      exit 0;
      "

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: skills-backend
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - 3000:3000
    environment:
      APP_ENV: development
      BACKEND_PORT: "3000"
      BACKEND_URL: http://localhost:3000
      FRONTEND_URL: http://localhost:5173
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/postgres
      BETTER_AUTH_SECRET: your_secret_key_here_of_at_least_32_characters
      BETTER_AUTH_URL: http://localhost:3000
      PUBLIC_ASSET_BASE_URL: http://localhost:3000
      # Internal Docker DNS for put/get/delete
      S3_ENDPOINT: http://minio:9000
      # Host-reachable endpoint embedded in browser redirects
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_BUCKET: assets
      S3_FORCE_PATH_STYLE: "true"
      ASSET_MAX_UPLOAD_BYTES: "52428800"
    networks:
      - app-network
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        APP_ENV: development
    container_name: skills-frontend
    depends_on:
      - backend
    ports:
      - 5173:80
    networks:
      - app-network
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:

networks:
  app-network:
    driver: bridge
